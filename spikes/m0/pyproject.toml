[project]
name = "passe-m0-spike"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "nvidia-cublas-cu12>=12.9.3.13; sys_platform == 'linux'",
    "nvidia-cuda-runtime-cu12>=12.9.79; sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'linux'",
    "nvidia-cufft-cu12>=11.4.1.4; sys_platform == 'linux'",
    "nvidia-curand-cu12>=10.3.10.19; sys_platform == 'linux'",
    "mlx-whisper>=0.4.2; sys_platform == 'darwin' and platform_machine == 'arm64'",  # pipecat's whisper module requires it on Apple Silicon
    "nvidia-ml-py>=13.615.71",
    "onnxruntime-gpu>=1.31.1; sys_platform == 'linux'",
    "pedalboard>=0.9.26",
    "pipecat-ai[kokoro,local,local-smart-turn-v3,openai,pocket-tts,silero,whisper]>=1.15.0",
    "psutil>=7.2.2",
    "pyrnnoise>=0.4.5; sys_platform == 'linux'",  # no macOS 15 wheel; spike falls back to --denoise none
    "rich>=15.0.0",
    "sherpa-onnx>=2.0.1",
    "snac>=1.2.1",
]
